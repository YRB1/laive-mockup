<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Laivestyle</title>
<meta name="description" content="Get in touch with Laivestyle.">
<meta name="theme-color" content="#0b0b0b">
<meta property="og:image" content="assets/img/ai/look-clouds.jpg">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div data-header></div>
<main class="wrap">
  <div class="page-head" style="padding-left:0;padding-right:0"><div><p class="crumbs" style="padding:0 0 10px"><a href="index.html">Home</a> / Contact</p><h1 class="display h2">Contact us</h1></div></div>
  <section class="sec contact-grid" style="padding-top:32px">
    <form class="form" data-contact>
      <label>Name<input required autocomplete="name"></label>
      <label>Email<input type="email" required autocomplete="email"></label>
      <label>Order number (optional)<input placeholder="#LV1001"></label>
      <label>Topic<select><option>Order question</option><option>Returns</option><option>Sizing</option><option>Wholesale</option><option>Collaboration</option><option>Other</option></select></label>
      <label class="full">Message<textarea required></textarea></label>
      <div class="full"><button class="btn btn--solid" type="submit">Send message</button></div>
    </form>
    <div class="prose" style="font-size:14px">
      <p class="label muted" style="margin:0 0 8px">Email</p><p style="margin:0 0 24px">[hello@laivestyle.com]</p>
      <p class="label muted" style="margin:0 0 8px">Response time</p><p style="margin:0 0 24px">1–2 working days</p>
      <p class="label muted" style="margin:0 0 8px">Social</p><p style="margin:0"><a class="link" href="https://instagram.com/laivestyle_" target="_blank" rel="noopener">Instagram @laivestyle_</a></p>
      <p style="margin-top:24px"><a class="link" href="faq.html">Most answers are in our FAQ</a></p>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="js/main.js"></script>
</body>
</html>
